<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>What's Your Dance Style? | Kate Bethers</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --pink: #b5477a;
      --dark-pink: #7c2d5e;
      --deep: #4a1a3a;
      --gold: #d4af37;
      --dark: #1e1e2e;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--dark);
      background-image:
        radial-gradient(ellipse at 20% 30%, rgba(181, 71, 122, 0.15) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 70%, rgba(212, 175, 55, 0.08) 0%, transparent 50%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    nav {
      background: rgba(30, 30, 46, 0.96);
      border-bottom: 2px solid var(--pink);
      padding: 14px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav a {
      text-decoration: none;
      font-size: 0.8rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 700;
    }

    nav .logo {
      color: var(--gold);
    }

    nav .back {
      color: rgba(255, 255, 255, 0.6);
      transition: color 0.2s;
    }

    nav .back:hover {
      color: #fff;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 50px 20px 70px;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--gold);
      text-align: center;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 0.75rem;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.45);
      margin-bottom: 44px;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(181, 71, 122, 0.28);
      border-radius: 16px;
      padding: 42px;
      max-width: 660px;
      width: 100%;
    }

    #quiz-area {
      display: block;
    }

    #result-area {
      display: none;
      text-align: center;
    }

    .q-counter {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--pink);
      margin-bottom: 12px;
    }

    .q-text {
      font-size: 1.25rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 28px;
      line-height: 1.6;
    }

    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .opt {
      background: rgba(255, 255, 255, 0.05);
      border: 1.5px solid rgba(181, 71, 122, 0.22);
      border-radius: 10px;
      padding: 15px 16px;
      color: #ccc;
      font-size: 0.9rem;
      cursor: pointer;
      text-align: left;
      transition: all 0.18s;
      line-height: 1.5;
      font-family: inherit;
    }

    .opt:hover {
      background: rgba(181, 71, 122, 0.18);
      border-color: var(--pink);
      color: #fff;
      transform: translateY(-2px);
    }

    .opt.selected {
      background: rgba(181, 71, 122, 0.25);
      border-color: var(--pink);
      color: #fff;
    }

    .progress-wrap {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      height: 4px;
      margin-top: 28px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--dark-pink), var(--gold));
      border-radius: 999px;
      transition: width 0.4s ease;
    }

    .next-btn {
      background: var(--pink);
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 12px 32px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 26px;
      transition: background 0.2s, transform 0.2s;
      opacity: 0.35;
      pointer-events: none;
    }

    .next-btn.active {
      opacity: 1;
      pointer-events: auto;
    }

    .next-btn:hover {
      background: var(--dark-pink);
      transform: translateY(-2px);
    }

    #loading {
      display: none;
      text-align: center;
      padding: 50px 0;
    }

    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(181, 71, 122, 0.2);
      border-top-color: var(--pink);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .result-label {
      font-size: 0.72rem;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 10px;
    }

    .result-badge {
      display: inline-block;
      background: linear-gradient(135deg, var(--dark-pink), var(--gold));
      color: #fff;
      font-size: 1.5rem;
      font-weight: 800;
      padding: 14px 34px;
      border-radius: 999px;
      margin: 6px 0 24px;
      letter-spacing: 0.5px;
    }

    .result-desc {
      color: #ccc;
      font-size: 1rem;
      line-height: 1.8;
      text-align: left;
      margin-bottom: 24px;
    }

    .tips-box {
      background: rgba(212, 175, 55, 0.07);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 10px;
      padding: 20px 24px;
      text-align: left;
      margin-bottom: 28px;
    }

    .tips-box h3 {
      font-size: 0.72rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 12px;
    }

    .tips-box ul {
      padding-left: 18px;
    }

    .tips-box ul li {
      color: #bbb;
      font-size: 0.9rem;
      line-height: 1.9;
    }

    .error-box {
      background: rgba(200, 50, 50, 0.1);
      border: 1px solid rgba(200, 50, 50, 0.3);
      border-radius: 10px;
      padding: 14px 18px;
      color: #f9a8a8;
      font-size: 0.88rem;
      margin-top: 14px;
      display: none;
    }

    .restart-btn {
      background: transparent;
      border: 2px solid var(--pink);
      color: var(--pink);
      border-radius: 999px;
      padding: 11px 30px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
    }

    .restart-btn:hover {
      background: var(--pink);
      color: #fff;
    }

    footer {
      text-align: center;
      padding: 20px;
      border-top: 1px solid rgba(181, 71, 122, 0.15);
      font-size: 0.8rem;
      color: #555;
    }

    footer a {
      color: var(--pink);
      text-decoration: none;
    }

    @media (max-width: 500px) {
      .options {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 1.7rem;
      }

      .card {
        padding: 26px 20px;
      }
    }
  </style>
</head>
<body>
  <nav>
    <a href="dance-scratch.html" class="back">← Back to Dance Page</a>
    <a href="index.html" class="logo">Kate Bethers</a>
  </nav>

  <main>
    <h1>What's Your Dance Style?</h1>
    <p class="subtitle">6 questions &nbsp;·&nbsp; Dance quiz</p>

    <div class="card">
      <div id="quiz-area">
        <div class="q-counter" id="q-counter">Question 1 of 6</div>
        <div class="q-text" id="q-text"></div>
        <div class="options" id="q-options"></div>
        <div class="progress-wrap">
          <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
        </div>
        <button class="next-btn" id="next-btn" onclick="nextQ()">Next →</button>

        <div id="loading">
          <div class="spinner"></div>
          <p style="color: rgba(255,255,255,0.45); font-size: 0.88rem;">
            Analyzing your vibe…
          </p>
        </div>
      </div>

      <div id="result-area">
        <p class="result-label">Your dance style is</p>
        <div class="result-badge" id="result-style">–</div>
        <p class="result-desc" id="result-desc"></p>

        <div class="tips-box">
          <h3>Getting started tips</h3>
          <ul id="result-tips"></ul>
        </div>

        <div class="error-box" id="result-error"></div>
        <button class="restart-btn" onclick="restart()">Try Again</button>
      </div>
    </div>
  </main>

  <footer>
    Kate Bethers &nbsp;·&nbsp; BYU Global Supply Chain &nbsp;·&nbsp;
    <a href="dance-scratch.html">Dance Page</a>
  </footer>

  <script>
    const Qs = [
      { q: "Pick the word that best describes your energy when a great song comes on:", opts: ["Powerful & fierce", "Flowing & free", "Fun & bouncy", "Elegant & composed"] },
      { q: "Your ideal workout looks like:", opts: ["High-intensity jumps & athleticism", "Slow stretching & core work", "Dance-cardio — moving to a beat", "Partner drills with precise footwork"] },
      { q: "If you could perform anywhere, where would it be?", opts: ["A street corner or city festival", "A black-box theater stage", "A nightclub or social dance hall", "A ballroom competition floor"] },
      { q: "Which fashion era speaks to you most?", opts: ["90s hip hop — baggy fits & fresh kicks", "Contemporary — flowy layers & earthy tones", "Colorful & vibrant — lots of movement", "Glamorous & formal — gowns and suits"] },
      { q: "How do you learn new things best?", opts: ["Freestyle & figure it out yourself", "Step-by-step slow breakdown", "Watching and copying", "Drilling until it's perfect"] },
      { q: "Pick a music vibe:", opts: ["Kendrick Lamar / hip hop beats", "Sigur Rós / ambient instrumental", "Bad Bunny / Latin pop", "Tchaikovsky / classical orchestra"] }
    ];

    let cur = 0;
    let answers = [];
    let sel = null;

    function render() {
      const q = Qs[cur];
      document.getElementById("q-counter").textContent = `Question ${cur + 1} of ${Qs.length}`;
      document.getElementById("q-text").textContent = q.q;

      const box = document.getElementById("q-options");
      box.innerHTML = "";

      q.opts.forEach((o, i) => {
        const b = document.createElement("button");
        b.className = "opt";
        b.type = "button";
        b.textContent = o;
        b.onclick = () => pick(i);
        box.appendChild(b);
      });

      sel = null;
      const nb = document.getElementById("next-btn");
      nb.classList.remove("active");
      nb.textContent = cur === Qs.length - 1 ? "Get My Result →" : "Next →";
      document.getElementById("progress-fill").style.width = (cur / Qs.length * 100) + "%";
    }

    function pick(i) {
      sel = i;
      document.querySelectorAll(".opt").forEach((b, j) => {
        b.classList.toggle("selected", j === i);
      });
      document.getElementById("next-btn").classList.add("active");
    }

    function nextQ() {
      if (sel === null) return;

      answers.push(sel);
      cur++;

      if (cur < Qs.length) {
        render();
      } else {
        showLoading();
        setTimeout(getResult, 700);
      }
    }

    function showLoading() {
      document.getElementById("q-counter").style.display = "none";
      document.getElementById("q-text").style.display = "none";
      document.getElementById("q-options").style.display = "none";
      document.getElementById("next-btn").style.display = "none";
      document.getElementById("loading").style.display = "block";
    }

    function getResult() {
      const scores = {
        "Hip-Hop": 0,
        "Contemporary": 0,
        "Latin": 0,
        "Ballroom": 0
      };

      answers.forEach((a) => {
        if (a === 0) scores["Hip-Hop"]++;
        if (a === 1) scores["Contemporary"]++;
        if (a === 2) scores["Latin"]++;
        if (a === 3) scores["Ballroom"]++;
      });

      const result = Object.keys(scores).reduce((a, b) =>
        scores[a] >= scores[b] ? a : b
      );

      const descriptions = {
        "Hip-Hop": "You’re bold, expressive, and full of energy. You love movement that feels strong, confident, and fun.",
        "Contemporary": "You’re creative, emotional, and drawn to movement that feels fluid and meaningful.",
        "Latin": "You’re lively, social, and love rhythm. Your energy fits vibrant styles full of personality.",
        "Ballroom": "You’re elegant, focused, and love structure. You shine in styles that value precision and poise."
      };

      const tips = {
        "Hip-Hop": ["Practice grooves daily", "Work on confidence", "Try freestyle sessions"],
        "Contemporary": ["Stretch often", "Focus on flow", "Use expression in movement"],
        "Latin": ["Practice timing", "Work on rhythm", "Dance with upbeat music"],
        "Ballroom": ["Focus on posture", "Practice footwork", "Work on control"]
      };

      document.getElementById("loading").style.display = "none";
      document.getElementById("quiz-area").style.display = "none";
      document.getElementById("result-area").style.display = "block";

      document.getElementById("result-style").textContent = result;
      document.getElementById("result-desc").textContent = descriptions[result];

      const ul = document.getElementById("result-tips");
      ul.innerHTML = "";
      tips[result].forEach((t) => {
        const li = document.createElement("li");
        li.textContent = t;
        ul.appendChild(li);
      });
    }

    function restart() {
      cur = 0;
      answers = [];
      sel = null;

      document.getElementById("quiz-area").style.display = "block";
      document.getElementById("result-area").style.display = "none";
      document.getElementById("loading").style.display = "none";

      document.getElementById("q-counter").style.display = "block";
      document.getElementById("q-text").style.display = "block";
      document.getElementById("q-options").style.display = "grid";
      document.getElementById("next-btn").style.display = "inline-block";

      render();
    }

    render();
  </script>
</body>
</html>
